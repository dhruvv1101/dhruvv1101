<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>
  </defs>

  <style>
    .quad-title { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .quad-stat { font-size: 15px; font-weight: 800; }
    .quad-desc { font-size: 10px; fill: #94a3b8; line-height: 1.45; }
    .pulse-dot { animation: pDot 2s ease-in-out infinite; }
    @keyframes pDot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>

  <!-- Container Base -->
  <rect width="880" height="230" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4" fill="#2dd4bf" class="pulse-dot" />
    <text x="18" y="10" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1.5">ENGINEERING DOMAIN MATRIX // CAPABILITIES &amp; EMPIRICAL PROOFS</text>
  </g>

  <!-- 4 Columns / Cards -->
  <!-- Card 1: Backend & Distributed Flows -->
  <g transform="translate(24, 46)">
    <rect width="198" height="160" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#38bdf8"/>
    <text x="14" y="26" class="quad-title" fill="#38bdf8">BACKEND FLOWS</text>
    <text x="14" y="50" class="quad-stat" fill="#f8fafc">Curefit SDE Intern</text>
    <text x="14" y="66" font-size="9" fill="#38bdf8" font-weight="600">Distributed Locks &amp; APIs</text>
    <path d="M 14 76 L 184 76" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="94" class="quad-desc">Redis-MongoDB Idempotency</text>
    <text x="14" y="110" class="quad-desc">Formbricks SDK in 2 flows</text>
    <text x="14" y="126" class="quad-desc">Uniware Invoice HLD</text>
    <text x="14" y="142" class="quad-desc" fill="#2dd4bf">Java · Spring · Mongo · Redis</text>
  </g>

  <!-- Card 2: Computer Vision & Automation -->
  <g transform="translate(236, 46)">
    <rect width="198" height="160" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#2dd4bf"/>
    <text x="14" y="26" class="quad-title" fill="#2dd4bf">VISION &amp; ROBOTICS</text>
    <text x="14" y="50" class="quad-stat" fill="#f8fafc">95%+ Gameplay Rel</text>
    <text x="14" y="66" font-size="9" fill="#2dd4bf" font-weight="600">Stockfish 17 &amp; MediaPipe</text>
    <path d="M 14 76 L 184 76" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="94" class="quad-desc">31.4 FPS Hand Tracking</text>
    <text x="14" y="110" class="quad-desc">&lt;2 sec engine recommendations</text>
    <text x="14" y="126" class="quad-desc">Cached DOM board coordinates</text>
    <text x="14" y="142" class="quad-desc" fill="#38bdf8">OpenCV · Python · Selenium</text>
  </g>

  <!-- Card 3: Predictive ML & Kaggle -->
  <g transform="translate(448, 46)">
    <rect width="198" height="160" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#f59e0b"/>
    <text x="14" y="26" class="quad-title" fill="#fbbf24">PREDICTIVE ML</text>
    <text x="14" y="50" class="quad-stat" fill="#f8fafc">0.94994 Bal-Acc</text>
    <text x="14" y="66" font-size="9" fill="#fbbf24" font-weight="600">Kaggle S6E7 + GSSoC '25</text>
    <path d="M 14 76 L 184 76" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="94" class="quad-desc">CatBoost + LightGBM blend</text>
    <text x="14" y="110" class="quad-desc">Optuna 200 trials search</text>
    <text x="14" y="126" class="quad-desc">RAG &amp; Federated Learning</text>
    <text x="14" y="142" class="quad-desc" fill="#fbbf24">PySyft · Flower · Scikit</text>
  </g>

  <!-- Card 4: Web Architecture & Extensions -->
  <g transform="translate(660, 46)">
    <rect width="198" height="160" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#818cf8"/>
    <text x="14" y="26" class="quad-title" fill="#a5b4fc">PRODUCT &amp; CP</text>
    <text x="14" y="50" class="quad-stat" fill="#f8fafc">1,549+ Solved</text>
    <text x="14" y="66" font-size="9" fill="#a5b4fc" font-weight="600">Codolio Verified Metrics</text>
    <path d="M 14 76 L 184 76" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="94" class="quad-desc">IntentLens: Flask + MV3 + n8n</text>
    <text x="14" y="110" class="quad-desc">Portfolio: 99 Lighthouse / 0 CLS</text>
    <text x="14" y="126" class="quad-desc">CF Specialist · 3★ CodeChef</text>
    <text x="14" y="142" class="quad-desc" fill="#a5b4fc">React 18 · TypeScript · Vite</text>
  </g>
</svg>
