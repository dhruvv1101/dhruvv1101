<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="540" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace">
  <style>
    .flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    .pulse { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    .subhead { font-size: 11px; fill: #64748b; letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase; }
    .title { font-size: 15px; fill: #f8fafc; font-weight: 700; letter-spacing: 0.5px; }
    .metric-val { font-size: 16px; font-weight: 800; fill: #2dd4bf; }
    .metric-lbl { font-size: 9.5px; fill: #94a3b8; letter-spacing: 0.8px; text-transform: uppercase; }
    .box-title { font-size: 13px; font-weight: 700; }
    .item-txt { font-size: 11px; fill: #cbd5e1; }
  </style>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="540" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(30, 26)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#2dd4bf" />
    <text x="20" y="11" class="subhead">Editorial Portfolio // Architecture &amp; Graphics Pipeline</text>
    <text x="0" y="36" class="title">REACT 18 + TYPESCRIPT · BESPOKE EDITORIAL GRID · CANVAS PHYSICS</text>
  </g>

  <!-- Key Metrics Strip -->
  <g transform="translate(530, 24)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="102" height="42" rx="6" fill="#111c2e" stroke="#1e2d42" stroke-width="1"/>
    <text x="10" y="18" class="metric-val">99 / 100</text>
    <text x="10" y="32" class="metric-lbl">Lighthouse</text>

    <!-- Metric 2 -->
    <rect x="110" y="0" width="106" height="42" rx="6" fill="#111c2e" stroke="#1e2d42" stroke-width="1"/>
    <text x="10" y="18" class="metric-val" fill="#38bdf8">0.000</text>
    <text x="10" y="32" class="metric-lbl">Layout Shift (CLS)</text>

    <!-- Metric 3 -->
    <rect x="224" y="0" width="96" height="42" rx="6" fill="#111c2e" stroke="#1e2d42" stroke-width="1"/>
    <text x="10" y="18" class="metric-val" fill="#a78bfa">&lt;65 KB</text>
    <text x="10" y="32" class="metric-lbl">Gzip Bundle</text>
  </g>

  <!-- SECTION 1: EDITORIAL UI & RADIX (LEFT) -->
  <g transform="translate(30, 95)">
    <rect width="250" height="340" rx="10" fill="url(#bgBox)" stroke="#0d9488" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#0f2f35" />
    <rect x="0" y="24" width="250" height="10" fill="#0f2f35" />
    <text x="16" y="22" class="box-title" fill="#2dd4bf">01 / EDITORIAL UI CORE</text>

    <!-- Item 1.1 -->
    <g transform="translate(14, 48)">
      <rect width="222" height="52" rx="6" fill="#07181c" stroke="#134e4a" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">React 18 + TypeScript</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Strict typed component hierarchy</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 102 L 125 116" stroke="#2dd4bf" stroke-width="1.5" class="flow" marker-end="url(#arr-teal)"/>

    <!-- Item 1.2 -->
    <g transform="translate(14, 118)">
      <rect width="222" height="58" rx="6" fill="#07181c" stroke="#134e4a" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Fluid Editorial Pacing</text>
      <text x="12" y="38" font-size="10" fill="#64748b">CSS clamp() typography system</text>
      <text x="12" y="50" font-size="9" fill="#2dd4bf">Magazine-quality case files</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 178 L 125 192" stroke="#2dd4bf" stroke-width="1.5" class="flow" marker-end="url(#arr-teal)"/>

    <!-- Item 1.3 -->
    <g transform="translate(14, 194)">
      <rect width="222" height="60" rx="6" fill="#07181c" stroke="#134e4a" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Radix UI Primitives</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Unstyled accessible components</text>
      <text x="12" y="52" font-size="9" fill="#38bdf8">WCAG 2.1 AA keyboard navigation</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 256 L 125 270" stroke="#2dd4bf" stroke-width="1.5" class="flow" marker-end="url(#arr-teal)"/>

    <!-- Item 1.4 -->
    <g transform="translate(14, 272)">
      <rect width="222" height="52" rx="6" fill="#07181c" stroke="#134e4a" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Lucide + Editorial Glyphs</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Zero icon font overhead</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <path d="M 280 265 L 315 265" stroke="#2dd4bf" stroke-width="2" class="flow" marker-end="url(#arr-teal)"/>

  <!-- SECTION 2: CANVAS PHYSICS SIMULATION (MIDDLE) -->
  <g transform="translate(315, 95)">
    <rect width="250" height="340" rx="10" fill="url(#bgBox)" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#082f49" />
    <rect x="0" y="24" width="250" height="10" fill="#082f49" />
    <text x="16" y="22" class="box-title" fill="#38bdf8">02 / CANVAS GRAPHICS</text>

    <!-- Item 2.1 -->
    <g transform="translate(14, 48)">
      <rect width="222" height="52" rx="6" fill="#061826" stroke="#075985" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">BoatScene Simulation</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Procedural wave physics loop</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 102 L 125 116" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 2.2 -->
    <g transform="translate(14, 118)">
      <rect width="222" height="58" rx="6" fill="#061826" stroke="#075985" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Delta-Time Easing Loops</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Decoupled frame calculations</text>
      <text x="12" y="50" font-size="9" fill="#38bdf8">60 FPS smooth animation lock</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 178 L 125 192" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 2.3 -->
    <g transform="translate(14, 194)">
      <rect width="222" height="60" rx="6" fill="#061826" stroke="#075985" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Dynamic Mascot States</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Interactive KioMascot emotions</text>
      <text x="12" y="52" font-size="9" fill="#a78bfa">Responds to scroll &amp; hover</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 256 L 125 270" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 2.4 -->
    <g transform="translate(14, 272)">
      <rect width="222" height="52" rx="6" fill="#061826" stroke="#075985" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Background Throttling</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Zero battery draw in dormant tabs</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <path d="M 565 265 L 600 265" stroke="#38bdf8" stroke-width="2" class="flow" marker-end="url(#arr-sky)"/>

  <!-- SECTION 3: BUILD PIPELINE & EDGE (RIGHT) -->
  <g transform="translate(600, 95)">
    <rect width="250" height="340" rx="10" fill="url(#bgBox)" stroke="#6366f1" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#1e1b4b" />
    <rect x="0" y="24" width="250" height="10" fill="#1e1b4b" />
    <text x="16" y="22" class="box-title" fill="#a5b4fc">03 / EDGE RUNTIME</text>

    <!-- Item 3.1 -->
    <g transform="translate(14, 48)">
      <rect width="222" height="52" rx="6" fill="#0d0d26" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Vite Bundler Engine</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Rollup zero-copy ESM splitting</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 102 L 125 116" stroke="#818cf8" stroke-width="1.5" class="flow" marker-end="url(#arr-violet)"/>

    <!-- Item 3.2 -->
    <g transform="translate(14, 118)">
      <rect width="222" height="58" rx="6" fill="#0d0d26" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">TailwindCSS JIT Purging</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Zero unused utility selectors</text>
      <text x="12" y="50" font-size="9" fill="#a5b4fc">&lt;65 KB total gzipped footprint</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 178 L 125 192" stroke="#818cf8" stroke-width="1.5" class="flow" marker-end="url(#arr-violet)"/>

    <!-- Item 3.3 -->
    <g transform="translate(14, 194)">
      <rect width="222" height="60" rx="6" fill="#0d0d26" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Static Edge Deployment</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Global edge CDN cache</text>
      <text x="12" y="52" font-size="9" fill="#2dd4bf">&lt;180 ms First Contentful Paint</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 256 L 125 270" stroke="#818cf8" stroke-width="1.5" class="flow" marker-end="url(#arr-violet)"/>

    <!-- Item 3.4 -->
    <g transform="translate(14, 272)">
      <rect width="222" height="52" rx="6" fill="#0d0d26" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Zero Layout Shift</text>
      <text x="12" y="38" font-size="10" fill="#64748b">CLS: 0.000 / Perfect Stability</text>
    </g>
  </g>

  <!-- BOTTOM ARCHITECTURAL DECISION STRIP -->
  <g transform="translate(30, 455)">
    <rect width="820" height="58" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <!-- Pill 1 -->
    <rect x="16" y="14" width="250" height="30" rx="5" fill="#0a2321" stroke="#134e4a" stroke-width="1"/>
    <text x="26" y="33" font-size="10.5" fill="#2dd4bf" font-weight="600">DEC-01: Fluid CSS Clamp System</text>

    <!-- Pill 2 -->
    <rect x="280" y="14" width="260" height="30" rx="5" fill="#091b26" stroke="#075985" stroke-width="1"/>
    <text x="290" y="33" font-size="10.5" fill="#38bdf8" font-weight="600">DEC-02: Decoupled Canvas Physics</text>

    <!-- Pill 3 -->
    <rect x="554" y="14" width="250" height="30" rx="5" fill="#191538" stroke="#3730a3" stroke-width="1"/>
    <text x="564" y="33" font-size="10.5" fill="#a5b4fc" font-weight="600">DEC-03: Ultra-Lean Edge Distribution</text>
  </g>
</svg>
