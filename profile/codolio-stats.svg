<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <style>
    .section-title { font-size: 11px; fill: #94a3b8; letter-spacing: 1.5px; font-weight: 700; }
    .plat-name { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
    .stat-num { font-size: 18px; font-weight: 800; fill: #f8fafc; }
    .stat-sub { font-size: 9.5px; fill: #94a3b8; }
    .highlight-gold { fill: #facc15; font-weight: 700; }
    .highlight-sky { fill: #38bdf8; font-weight: 700; }
    .highlight-amber { fill: #f59e0b; font-weight: 700; }
    .highlight-indigo { fill: #c084fc; font-weight: 700; }
    .badge-chip { font-size: 10px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Container Base -->
  <rect width="880" height="260" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4" fill="#facc15" />
    <text x="18" y="10" class="section-title">CODOLIO VERIFIED ALGORITHMIC METRICS // 1,549+ PROBLEMS SOLVED</text>
    <text x="730" y="10" font-size="10" fill="#38bdf8" font-weight="600">PROFILE: Dhruv83170</text>
  </g>

  <!-- 4 Platform Stat Cards -->
  <!-- 1. LeetCode -->
  <g transform="translate(24, 44)">
    <rect width="198" height="135" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#f59e0b"/>
    <text x="14" y="24" class="plat-name" fill="#fbbf24">LEETCODE</text>
    <text x="14" y="48" class="stat-num">678 <tspan font-size="11" font-weight="500" fill="#64748b">solved</tspan></text>
    <text x="14" y="66" class="stat-sub">189 Easy · <tspan fill="#38bdf8">401 Med</tspan> · <tspan fill="#f43f5e">88 Hard</tspan></text>
    <path d="M 14 78 L 184 78" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="96" class="stat-sub">Contest Rating: <tspan class="highlight-amber">1724</tspan></text>
    <text x="14" y="112" class="stat-sub">Peak Contest Rank: <tspan class="highlight-gold">#695</tspan></text>
    <text x="14" y="126" font-size="9" fill="#94a3b8">Handle: <tspan fill="#cbd5e1">ImpWevvB</tspan></text>
  </g>

  <!-- 2. Codeforces -->
  <g transform="translate(236, 44)">
    <rect width="198" height="135" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#38bdf8"/>
    <text x="14" y="24" class="plat-name" fill="#38bdf8">CODEFORCES</text>
    <text x="14" y="48" class="stat-num">473 <tspan font-size="11" font-weight="500" fill="#64748b">solved</tspan></text>
    <text x="14" y="66" class="stat-sub">Rank: <tspan class="highlight-sky">Specialist</tspan></text>
    <path d="M 14 78 L 184 78" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="96" class="stat-sub">Max Rating: <tspan class="highlight-sky">1411</tspan></text>
    <text x="14" y="112" class="stat-sub">Contests Fought: <tspan class="highlight-gold">29</tspan></text>
    <text x="14" y="126" font-size="9" fill="#94a3b8">Handle: <tspan fill="#cbd5e1">Dhruv83170</tspan></text>
  </g>

  <!-- 3. CodeChef -->
  <g transform="translate(448, 44)">
    <rect width="198" height="135" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#a855f7"/>
    <text x="14" y="24" class="plat-name" fill="#c084fc">CODECHEF</text>
    <text x="14" y="48" class="stat-num">160 <tspan font-size="11" font-weight="500" fill="#64748b">solved</tspan></text>
    <text x="14" y="66" class="stat-sub">Division: <tspan class="highlight-indigo">3-Star (★★★)</tspan></text>
    <path d="M 14 78 L 184 78" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="96" class="stat-sub">Peak Rating: <tspan class="highlight-indigo">1676</tspan></text>
    <text x="14" y="112" class="stat-sub">Latest Starters 200: <tspan class="highlight-gold">Rank 718</tspan></text>
    <text x="14" y="126" font-size="9" fill="#94a3b8">Handle: <tspan fill="#cbd5e1">msl_overflow</tspan></text>
  </g>

  <!-- 4. GFG & CodeStudio -->
  <g transform="translate(660, 44)">
    <rect width="198" height="135" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1" fill="#38bdf8"/>
    <text x="14" y="24" class="plat-name" fill="#38bdf8">GFG &amp; CODESTUDIO</text>
    <text x="14" y="48" class="stat-num">238 <tspan font-size="11" font-weight="500" fill="#64748b">solved</tspan></text>
    <text x="14" y="66" class="stat-sub">GFG: 187 (88 Medium, 6 Hard)</text>
    <path d="M 14 78 L 184 78" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="96" class="stat-sub">CodeStudio: <tspan class="highlight-sky">51 Solved</tspan></text>
    <text x="14" y="112" class="stat-sub">HackerRank: <tspan class="highlight-amber">Top 10% Global</tspan></text>
    <text x="14" y="126" font-size="9" fill="#94a3b8">Coding Intermediate Cert</text>
  </g>

  <!-- Bottom Badges Strip -->
  <g transform="translate(24, 195)">
    <rect width="832" height="45" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <!-- Badge 1: JEE -->
    <rect x="12" y="9" width="220" height="27" rx="4" fill="#091b26" stroke="#1e3a5f" stroke-width="1"/>
    <text x="20" y="26" class="badge-chip">🎯 <tspan class="highlight-sky">JEE Mains: 98.18 %ile</tspan> (Adv Qual)</text>

    <!-- Badge 2: Flipkart Grid -->
    <rect x="242" y="9" width="200" height="27" rx="4" fill="#1c1308" stroke="#52320a" stroke-width="1"/>
    <text x="250" y="26" class="badge-chip">⚡ <tspan class="highlight-amber">Flipkart GRID Semifinalist</tspan></text>

    <!-- Badge 3: LeetCode Daily -->
    <rect x="452" y="9" width="180" height="27" rx="4" fill="#17120a" stroke="#78350f" stroke-width="1"/>
    <text x="460" y="26" class="badge-chip">🔥 <tspan class="highlight-gold">8+ LeetCode Badges</tspan></text>

    <!-- Badge 4: Table Tennis Sports -->
    <rect x="642" y="9" width="178" height="27" rx="4" fill="#191538" stroke="#3730a3" stroke-width="1"/>
    <text x="650" y="26" class="badge-chip">🏓 <tspan class="highlight-indigo">URJA TT Winner '25</tspan></text>
  </g>
</svg>
