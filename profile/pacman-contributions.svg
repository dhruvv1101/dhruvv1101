<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180" font-family="'Press Start 2P', 'JetBrains Mono', Consolas, monospace">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pacBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Maze Glow -->
    <filter id="neonBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    text {
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .retro-score { font-size: 11px; fill: #facc15; font-weight: 700; letter-spacing: 1.5px; }
    .retro-lbl { font-size: 10px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; }

    /* Pacman Chomping and Gliding Animation */
    @keyframes pacmanGlide {
      0% { transform: translateX(40px); }
      48% { transform: translateX(650px) scaleX(1); }
      50% { transform: translateX(650px) scaleX(-1); }
      98% { transform: translateX(40px) scaleX(-1); }
      100% { transform: translateX(40px) scaleX(1); }
    }

    @keyframes chompTop {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-35deg); }
    }
    @keyframes chompBottom {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(35deg); }
    }

    /* Ghosts Gliding behind Pacman */
    @keyframes ghostGlideRed {
      0% { transform: translateX(10px); }
      48% { transform: translateX(600px); }
      50% { transform: translateX(600px); }
      98% { transform: translateX(10px); }
      100% { transform: translateX(10px); }
    }
    @keyframes ghostGlideCyan {
      0% { transform: translateX(-35px); }
      48% { transform: translateX(555px); }
      50% { transform: translateX(555px); }
      98% { transform: translateX(-35px); }
      100% { transform: translateX(-35px); }
    }

    /* Pellet Eaten Pulsing */
    @keyframes pelletPulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Mushroom Hover Bounce */
    @keyframes mushroomFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .pac-track { animation: pacmanGlide 14s linear infinite; }
    .ghost-red { animation: ghostGlideRed 14s linear infinite; }
    .ghost-cyan { animation: ghostGlideCyan 14s linear infinite; }
    .shroom { animation: mushroomFloat 2s ease-in-out infinite; }
    .pellet-blink { animation: pelletPulse 1.2s ease-in-out infinite; }
  ]]></style>

  <!-- Arcade Cabinet Frame -->
  <rect width="880" height="180" rx="14" fill="url(#pacBg)" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Neon Maze Outline Borders -->
  <rect x="14" y="12" width="852" height="156" rx="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.85" filter="url(#neonBlue)"/>
  <rect x="18" y="16" width="844" height="148" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Top Retro Scoreboard -->
  <g transform="translate(36, 38)">
    <text x="0" y="0" class="retro-lbl">1UP</text>
    <text x="0" y="16" class="retro-score" fill="#f43f5e">01549</text>

    <text x="210" y="0" class="retro-lbl">HIGH SCORE</text>
    <text x="210" y="16" class="retro-score" fill="#facc15">98,180 PTS</text>

    <text x="440" y="0" class="retro-lbl">STAGE</text>
    <text x="440" y="16" class="retro-score" fill="#38bdf8">IIITM-GWALIOR</text>

    <text x="640" y="0" class="retro-lbl">POWER-UP</text>
    <text x="640" y="16" class="retro-score" fill="#4ade80">SUPER MUSHROOM</text>
  </g>

  <!-- Divider Line -->
  <line x1="28" y1="64" x2="852" y2="64" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Contribution Grid Pellets Runway (Simulated GitHub Contribution Matrix) -->
  <g transform="translate(48, 108)">
    <!-- Dots along the track -->
    <!-- Col 1 to 24 dots representing contribution weeks -->
    <circle cx="0" cy="0" r="3.5" fill="#1e293b"/>
    <circle cx="28" cy="0" r="3.5" fill="#14532d"/>
    <circle cx="56" cy="0" r="3.5" fill="#16a34a"/>
    <circle cx="84" cy="0" r="3.5" fill="#22c55e"/>
    <circle cx="112" cy="0" r="3.5" fill="#4ade80"/>
    <circle cx="140" cy="0" r="3.5" fill="#16a34a"/>
    <circle cx="168" cy="0" r="3.5" fill="#22c55e"/>
    <circle cx="196" cy="0" r="7" fill="#facc15" class="pellet-blink"/> <!-- Energizer 1 -->
    <circle cx="224" cy="0" r="3.5" fill="#14532d"/>
    <circle cx="252" cy="0" r="3.5" fill="#16a34a"/>
    <circle cx="280" cy="0" r="3.5" fill="#22c55e"/>
    <circle cx="308" cy="0" r="3.5" fill="#4ade80"/>
    <circle cx="336" cy="0" r="3.5" fill="#16a34a"/>
    <circle cx="364" cy="0" r="3.5" fill="#22c55e"/>
    <circle cx="392" cy="0" r="3.5" fill="#14532d"/>
    <circle cx="420" cy="0" r="7" fill="#facc15" class="pellet-blink"/> <!-- Energizer 2 -->
    <circle cx="448" cy="0" r="3.5" fill="#16a34a"/>
    <circle cx="476" cy="0" r="3.5" fill="#22c55e"/>
    <circle cx="504" cy="0" r="3.5" fill="#4ade80"/>
    <circle cx="532" cy="0" r="3.5" fill="#16a34a"/>
    <circle cx="560" cy="0" r="3.5" fill="#22c55e"/>
    <circle cx="588" cy="0" r="3.5" fill="#14532d"/>
    <circle cx="616" cy="0" r="7" fill="#facc15" class="pellet-blink"/> <!-- Energizer 3 -->
    <circle cx="644" cy="0" r="3.5" fill="#22c55e"/>
    <circle cx="672" cy="0" r="3.5" fill="#4ade80"/>
  </g>

  <!-- ANIMATED SPRITES LAYER -->
  <g transform="translate(0, 108)">
    <!-- Cyan Ghost (Inky) -->
    <g class="ghost-cyan">
      <path d="M 0 -14 C 0 -22 16 -22 16 -14 L 16 2 L 12 -1 L 8 2 L 4 -1 L 0 2 Z" fill="#06b6d4" />
      <circle cx="5" cy="-12" r="2.5" fill="#ffffff" />
      <circle cx="6" cy="-12" r="1.2" fill="#1e3a8a" />
      <circle cx="11" cy="-12" r="2.5" fill="#ffffff" />
      <circle cx="12" cy="-12" r="1.2" fill="#1e3a8a" />
    </g>

    <!-- Red Ghost (Blinky) -->
    <g class="ghost-red">
      <path d="M 0 -14 C 0 -22 16 -22 16 -14 L 16 2 L 12 -1 L 8 2 L 4 -1 L 0 2 Z" fill="#ef4444" />
      <circle cx="5" cy="-12" r="2.5" fill="#ffffff" />
      <circle cx="6" cy="-12" r="1.2" fill="#1e3a8a" />
      <circle cx="11" cy="-12" r="2.5" fill="#ffffff" />
      <circle cx="12" cy="-12" r="1.2" fill="#1e3a8a" />
    </g>

    <!-- Pacman Chomp Sprite -->
    <g class="pac-track">
      <!-- Top jaw -->
      <path d="M 0 0 L 16 0 A 16 16 0 0 0 -16 0 Z" fill="#facc15" style="animation: chompTop 0.35s ease-in-out infinite alternate; transform-origin: 0px 0px;"/>
      <!-- Bottom jaw -->
      <path d="M 0 0 L 16 0 A 16 16 0 0 1 -16 0 Z" fill="#facc15" style="animation: chompBottom 0.35s ease-in-out infinite alternate; transform-origin: 0px 0px;"/>
      <!-- Eye -->
      <circle cx="1" cy="-8" r="2" fill="#000000"/>
    </g>
  </g>

  <!-- MARIO 8-BIT SUPER MUSHROOM POWER-UP (Right Side Goal) -->
  <g class="shroom" transform="translate(770, 88)">
    <!-- Mushroom Cap -->
    <rect x="6" y="0" width="24" height="6" fill="#ef4444" />
    <rect x="2" y="6" width="32" height="12" fill="#ef4444" />
    <!-- White Spots -->
    <rect x="8" y="4" width="8" height="8" fill="#ffffff" />
    <rect x="22" y="6" width="6" height="8" fill="#ffffff" />
    <!-- Face / Stem -->
    <rect x="6" y="18" width="24" height="10" fill="#fde047" />
    <!-- Eyes -->
    <rect x="10" y="20" width="3" height="6" fill="#000000" />
    <rect x="23" y="20" width="3" height="6" fill="#000000" />
    <!-- Base -->
    <rect x="8" y="28" width="20" height="2" fill="#000000" />
    <!-- Score Popup Tag -->
    <text x="-4" y="-8" font-size="9" fill="#facc15" font-weight="700">+1000 PTS</text>
  </g>

  <!-- Bottom Arcade Footer Details -->
  <g transform="translate(36, 160)">
    <text x="0" y="0" font-size="9" fill="#64748b">CHOMPING COMMITS &amp; DSA PROBLEMS // CONTINUOUS INTEGRATION RUNNING 24/7</text>
    <text x="668" y="0" font-size="9.5" fill="#facc15" font-weight="700">INSERT COIN [●●]</text>
  </g>
</svg>
