<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="540" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace">
  <style>
    .flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    .pulse { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    .subhead { font-size: 11px; fill: #64748b; letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase; }
    .title { font-size: 15px; fill: #f8fafc; font-weight: 700; letter-spacing: 0.5px; }
    .metric-val { font-size: 16px; font-weight: 800; fill: #2dd4bf; }
    .metric-lbl { font-size: 9.5px; fill: #94a3b8; letter-spacing: 0.8px; text-transform: uppercase; }
    .box-title { font-size: 13px; font-weight: 700; }
    .item-txt { font-size: 11px; fill: #cbd5e1; }
    .tag-txt { font-size: 9.5px; font-weight: 600; }
  </style>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-gold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#facc15"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#818cf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#f59e0b"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="540" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(30, 26)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#facc15" />
    <text x="20" y="11" class="subhead">ChessFlow // Perception, Automation &amp; Engine Pipeline</text>
    <text x="0" y="36" class="title">END-TO-END VISION GESTURE CONTROL &amp; STOCKFISH 17 ANALYSIS</text>
  </g>

  <!-- Key Metrics Strip -->
  <g transform="translate(530, 24)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="102" height="42" rx="6" fill="#111c2e" stroke="#1e2d42" stroke-width="1"/>
    <text x="10" y="18" class="metric-val" fill="#facc15">31.4 FPS</text>
    <text x="10" y="32" class="metric-lbl">Tracking Speed</text>

    <!-- Metric 2 -->
    <rect x="110" y="0" width="106" height="42" rx="6" fill="#111c2e" stroke="#1e2d42" stroke-width="1"/>
    <text x="10" y="18" class="metric-val" fill="#38bdf8">&lt;2 sec</text>
    <text x="10" y="32" class="metric-lbl">Move Time (95%+ Rel)</text>

    <!-- Metric 3 -->
    <rect x="224" y="0" width="96" height="42" rx="6" fill="#111c2e" stroke="#1e2d42" stroke-width="1"/>
    <text x="10" y="18" class="metric-val" fill="#a78bfa">Stockfish 17</text>
    <text x="10" y="32" class="metric-lbl">Depth-20 Engine</text>
  </g>

  <!-- SECTION 1: PERCEPTION & INPUT (LEFT) -->
  <g transform="translate(30, 95)">
    <rect width="250" height="340" rx="10" fill="url(#bgBox)" stroke="#1e3a5f" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#132337" />
    <rect x="0" y="24" width="250" height="10" fill="#132337" />
    <text x="16" y="22" class="box-title" fill="#38bdf8">01 / COMPUTER VISION</text>

    <!-- Item 1.1 -->
    <g transform="translate(14, 48)">
      <rect width="222" height="52" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Webcam Ingestion (720p)</text>
      <text x="12" y="38" font-size="10" fill="#64748b">OpenCV VideoStream @ 30+ FPS</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 102 L 125 116" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 1.2 -->
    <g transform="translate(14, 118)">
      <rect width="222" height="58" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">MediaPipe Hands Pipeline</text>
      <text x="12" y="38" font-size="10" fill="#64748b">21 3D Landmark Extractor</text>
      <text x="12" y="50" font-size="9" fill="#38bdf8">Confidence threshold &gt; 0.85</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 178 L 125 192" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 1.3 -->
    <g transform="translate(14, 194)">
      <rect width="222" height="60" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Hysteresis State Machine</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Pinch: Δd &lt; 28px | Release: &gt; 42px</text>
      <text x="12" y="52" font-size="9" fill="#10b981">Prevents jitter clicks &amp; drift</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 256 L 125 270" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 1.4 -->
    <g transform="translate(14, 272)">
      <rect width="222" height="52" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">OS Virtual Mouse Dispatch</text>
      <text x="12" y="38" font-size="10" fill="#64748b">PyAutoGUI sub-pixel cursor move</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <path d="M 280 265 L 315 265" stroke="#38bdf8" stroke-width="2" class="flow" marker-end="url(#arr-sky)"/>

  <!-- SECTION 2: DOM & BOARD REGION SNIP (MIDDLE) -->
  <g transform="translate(315, 95)">
    <rect width="250" height="340" rx="10" fill="url(#bgBox)" stroke="#1e3a5f" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#0f1d35" />
    <rect x="0" y="24" width="250" height="10" fill="#0f1d35" />
    <text x="16" y="22" class="box-title" fill="#38bdf8">02 / BOARD DISCOVERY</text>

    <!-- Item 2.1 -->
    <g transform="translate(14, 48)">
      <rect width="222" height="52" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Headless Selenium Bridge</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Inspects chess.com board DOM node</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 102 L 125 116" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 2.2 -->
    <g transform="translate(14, 118)">
      <rect width="222" height="58" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Cached Region Coordinate</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Saved to data/board_region.json</text>
      <text x="12" y="50" font-size="9" fill="#38bdf8">0 ms continuous DOM re-query</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 178 L 125 192" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 2.3 -->
    <g transform="translate(14, 194)">
      <rect width="222" height="60" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">High-Speed Screen Snip</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Direct OS framebuffer snip (12ms)</text>
      <text x="12" y="52" font-size="9" fill="#facc15">Zero DOM IPC overhead</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 256 L 125 270" stroke="#38bdf8" stroke-width="1.5" class="flow" marker-end="url(#arr-sky)"/>

    <!-- Item 2.4 -->
    <g transform="translate(14, 272)">
      <rect width="222" height="52" rx="6" fill="#09111c" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">OCR &amp; FEN Validator</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Rule-validity check via python-chess</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <path d="M 565 265 L 600 265" stroke="#818cf8" stroke-width="2" class="flow" marker-end="url(#arr-indigo)"/>

  <!-- SECTION 3: STOCKFISH ENGINE & UI (RIGHT) -->
  <g transform="translate(600, 95)">
    <rect width="250" height="340" rx="10" fill="url(#bgBox)" stroke="#4338ca" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#1e1b4b" />
    <rect x="0" y="24" width="250" height="10" fill="#1e1b4b" />
    <text x="16" y="22" class="box-title" fill="#a5b4fc">03 / ENGINE REASONING</text>

    <!-- Item 3.1 -->
    <g transform="translate(14, 48)">
      <rect width="222" height="52" rx="6" fill="#0e0d24" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Stockfish 17 Engine</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Multithreaded Depth 20 Analysis</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 102 L 125 116" stroke="#818cf8" stroke-width="1.5" class="flow" marker-end="url(#arr-indigo)"/>

    <!-- Item 3.2 -->
    <g transform="translate(14, 118)">
      <rect width="222" height="58" rx="6" fill="#0e0d24" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Threat Delta &amp; Multi-PV</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Calculates centipawn evaluation swing</text>
      <text x="12" y="50" font-size="9" fill="#818cf8">Flags tactical blunders live</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 178 L 125 192" stroke="#818cf8" stroke-width="1.5" class="flow" marker-end="url(#arr-indigo)"/>

    <!-- Item 3.3 -->
    <g transform="translate(14, 194)">
      <rect width="222" height="60" rx="6" fill="#0e0d24" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">Streamlit Interactive HUD</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Real-time suggested move overlay</text>
      <text x="12" y="52" font-size="9" fill="#a5b4fc">Webcam feed + board evaluation</text>
    </g>

    <!-- Arrow down -->
    <path d="M 125 256 L 125 270" stroke="#818cf8" stroke-width="1.5" class="flow" marker-end="url(#arr-indigo)"/>

    <!-- Item 3.4 -->
    <g transform="translate(14, 272)">
      <rect width="222" height="52" rx="6" fill="#0e0d24" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="22" class="item-txt" font-weight="600">SQLite History Persistence</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Stores game accuracy &amp; review logs</text>
    </g>
  </g>

  <!-- BOTTOM ARCHITECTURAL DECISION STRIP -->
  <g transform="translate(30, 455)">
    <rect width="820" height="58" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <!-- Pill 1 -->
    <rect x="16" y="14" width="250" height="30" rx="5" fill="#091b26" stroke="#1e3a5f" stroke-width="1"/>
    <text x="26" y="33" font-size="10.5" fill="#38bdf8" font-weight="600">DEC-01: Dual-Tier Distance Hysteresis</text>

    <!-- Pill 2 -->
    <rect x="280" y="14" width="260" height="30" rx="5" fill="#17120a" stroke="#78350f" stroke-width="1"/>
    <text x="290" y="33" font-size="10.5" fill="#facc15" font-weight="600">DEC-02: Bounding Rect Coordinate Cache</text>

    <!-- Pill 3 -->
    <rect x="554" y="14" width="250" height="30" rx="5" fill="#191538" stroke="#3730a3" stroke-width="1"/>
    <text x="564" y="33" font-size="10.5" fill="#a5b4fc" font-weight="600">DEC-03: Headless Container Fallback Switch</text>
  </g>
</svg>
