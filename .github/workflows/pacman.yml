name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/pacman-contribution-graph.svg"
      - "assets/pacman-contribution-graph-dark.svg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the supplied Pacman artwork with contribution data
        run: python scripts/update_pacman.py --user "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman-contribution-graph.svg assets/pacman-contribution-graph-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Pacman contribution artwork"
          git pull --rebase origin main
          git push origin HEAD:main
