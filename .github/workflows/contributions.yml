name: Update contribution artwork

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contributions.yml"
      - "scripts/generate_contributions.py"

permissions:
  contents: write

concurrency:
  group: contribution-artwork
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVGs from GitHub contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contributions.py --user "${{ github.repository_owner }}"
      - name: Commit changed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contribution-constellation.svg profile/pacman-contribution-graph.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update contribution artwork"
          git pull --rebase origin main
          git push origin HEAD:main
